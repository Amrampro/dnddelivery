# Isolated test service only. These credentials are public fixtures, not production secrets.
services:
  mariadb-test:
    image: mariadb:10.11.19
    environment:
      MARIADB_DATABASE: dnd_delivery_mariadb_test
      MARIADB_USER: dnd_test
      MARIADB_PASSWORD: dnd_test_only
      MARIADB_ROOT_PASSWORD: dnd_test_root_only
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
  mysql-test:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1", "--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: dnd_delivery_test
      MYSQL_USER: dnd_test
      MYSQL_PASSWORD: dnd_test_only
      MYSQL_ROOT_PASSWORD: dnd_test_root_only
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdnd_test_root_only"]
      interval: 5s
      retries: 30
