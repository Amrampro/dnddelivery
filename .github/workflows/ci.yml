name: DND Delivery checks
on: [workflow_call]
permissions:
  contents: read
jobs:
  mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: dnd_delivery_mariadb_test
          MARIADB_USER: dnd_test
          MARIADB_PASSWORD: ci_fixture_only
          MARIADB_ROOT_PASSWORD: ci_root_fixture_only
        ports:
          - 127.0.0.1:3308:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_ENGINE: mariadb
      DATABASE_URL: mysql://dnd_test:ci_fixture_only@127.0.0.1:3308/dnd_delivery_mariadb_test
      TEST_DATABASE_URL: mysql://dnd_test:ci_fixture_only@127.0.0.1:3308/dnd_delivery_mariadb_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - name: Generate isolated test key
        run: node -e 'const {randomBytes}=require("node:crypto"); require("node:fs").appendFileSync(process.env.GITHUB_ENV, "DELIVERY_SECRET="+randomBytes(32).toString("hex")+"\n")'
      - name: Apply all migrations to empty MariaDB database
        run: npm run db:migrate:deploy
      - name: Reapply without pending migrations
        run: npm run db:migrate:deploy
      - run: npm run db:migrate:status
      - name: Exercise business integrity and existing data
        run: npm run test:db
      - name: Recheck migrations after business writes
        run: npm run db:migrate:deploy
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, webapp, mobileapp]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - if: matrix.app != 'webapp'
        run: npm run typecheck
      - if: matrix.app != 'mobileapp'
        run: npm run build
      - if: matrix.app == 'mobileapp'
        run: npm run build -- --max-workers 2
        env:
          CI: 'true'
      - name: Generate API unit-test key
        if: matrix.app == 'api'
        run: node -e 'const {randomBytes}=require("node:crypto"); require("node:fs").appendFileSync(process.env.GITHUB_ENV, "DELIVERY_SECRET="+randomBytes(32).toString("hex")+"\n")'
      - run: npm test
        env:
          LOG_LEVEL: silent
      - name: Check mobile test types
        if: matrix.app == 'mobileapp'
        run: npm run typecheck:tests
      - name: Check Expo dependency compatibility
        if: matrix.app == 'mobileapp'
        run: npm run check:dependencies
        env:
          CI: 'true'
      - name: Run Expo Doctor
        if: matrix.app == 'mobileapp'
        run: npm run doctor
        env:
          CI: 'true'
      - if: matrix.app != 'mobileapp'
        run: |
          npm run test:dependency-security
          npm run audit:security

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_fixture_only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: dnd_delivery_test
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_fixture_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: mysql://root:ci_fixture_only@127.0.0.1:3306/dnd_delivery_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - name: Pin local MySQL authentication public key
        run: |
          docker exec ${{ job.services.mysql.id }} cat /var/lib/mysql/public_key.pem > "$RUNNER_TEMP/dnd-mysql-public.pem"
          echo "DATABASE_RSA_PUBLIC_KEY_FILE=$RUNNER_TEMP/dnd-mysql-public.pem" >> "$GITHUB_ENV"
      - name: Generate isolated test key
        run: node -e 'const {randomBytes}=require("node:crypto"); require("node:fs").appendFileSync(process.env.GITHUB_ENV, "DELIVERY_SECRET="+randomBytes(32).toString("hex")+"\n")'
      - run: npm run test:db
